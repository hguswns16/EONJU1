<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>절망의 슈팅게임</title>
    <style>
        body { text-align: center; background: #222; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        #canvas { background: #4caf50; border: 4px solid white; border-radius: 8px; cursor: pointer; }
        #msg { font-size: 24px; font-weight: bold; margin-top: 15px; color: #ff5252; height: 30px; }
    </style>
</head>
<body>
    <h1>야신 모드 키퍼 승부차기</h1>
    <p>골대 아무 곳이나 클릭해서 공을 차보세요.</p>
    <canvas id="canvas" width="600" height="400"></canvas>
    <div id="msg"></div>

<script>
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
const msg = document.getElementById('msg');

// 골대 크기 및 위치
const goal = { x: 100, y: 50, w: 400, h: 150 };
// 공 위치
let ball = { x: 300, y: 350, r: 12, vx: 0, vy: 0, moving: false };
// 키퍼 위치
let keeper = { x: 300, y: 160, w: 40, h: 60 };

const msgs = [
    "어림도 없지! 야신급 슈퍼세이브!",
    "손가락 끝으로 쳐냅니다! 막혔습니다!",
    "궤적을 미리 읽었습니다! 슈퍼 세이브!",
    "공중 회전 반사신경! 이걸 막아내네요!",
    "골문은 완전히 봉쇄되었습니다!"
];

function draw() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    // 잔디 선
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(300, 350, 80, Math.PI, 0); ctx.stroke();

    // 골대
    ctx.strokeStyle = "white";
    ctx.lineWidth = 8;
    ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);

    // 골대 그물 효과
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    for(let x = goal.x; x <= goal.x + goal.w; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, goal.y); ctx.lineTo(x, goal.y + goal.h); ctx.stroke();
    }
    for(let y = goal.y; y <= goal.y + goal.h; y += 20) {
        ctx.beginPath(); ctx.moveTo(goal.x, y); ctx.lineTo(goal.x + goal.w, y); ctx.stroke();
    }

    // 골키퍼
    ctx.fillStyle = "#ffeb3b";
    ctx.fillRect(keeper.x - keeper.w/2, keeper.y - keeper.h/2, keeper.w, keeper.h);
    // 키퍼 머리
    ctx.fillStyle = "#ffcc80";
    ctx.beginPath(); ctx.arc(keeper.x, keeper.y - keeper.h/2 - 10, 12, 0, Math.PI*2); ctx.fill();

    // 공
    ctx.fillStyle = "white";
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "black"; ctx.lineWidth = 2; ctx.stroke();
}

function update() {
    if (ball.moving) {
        ball.x += ball.vx;
        ball.y += ball.vy;

        // 공이 골대 라인 근처로 가면 키퍼가 순간이동급으로 막음
        if (ball.y <= goal.y + goal.h / 2 + 10) {
            keeper.x = ball.x;
            keeper.y = ball.y;
            ball.moving = false;
            
            // 랜덤 방어 멘트 출력
            msg.innerText = msgs[Math.floor(Math.random() * msgs.length)];

            setTimeout(reset, 1200);
        }
    }
}

function reset() {
    ball.x = 300; ball.y = 350;
    ball.vx = 0; ball.vy = 0;
    ball.moving = false;
    keeper.x = 300; keeper.y = 160;
    msg.innerText = "";
}

cvs.addEventListener('click', (e) => {
    if (ball.moving) return;

    const rect = cvs.getBoundingClientRect();
    const targetX = e.clientX - rect.left;
    const targetY = e.clientY - rect.top;

    // 공 이동 속도 계산
    const dx = targetX - ball.x;
    const dy = targetY - ball.y;
    const steps = 15;

    ball.vx = dx / steps;
    ball.vy = dy / steps;
    ball.moving = true;
});

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
