<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슈퍼 풋볼 슈팅 챌린지 (Super Football Shooting Challenge)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            color: #4facfe;
        }
        .header p {
            font-size: 0.95rem;
            color: #a0aec0;
            margin-top: 5px;
        }

        /* Scoreboard & Gauge Container */
        .game-ui {
            width: 800px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .stat-box {
            text-align: center;
        }
        .stat-box .label {
            font-size: 0.8rem;
            color: #cbd5e0;
            text-transform: uppercase;
        }
        .stat-box .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00f2fe;
        }

        /* Game Arena Canvas Wrapper */
        .canvas-container {
            position: relative;
            width: 800px;
            height: 500px;
            max-width: 95vw;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.2);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #2e7d32;
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .overlay.hidden {
            display: none;
        }
        .overlay h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 0 15px rgba(79, 172, 254, 0.6);
        }
        .overlay p {
            font-size: 1.1rem;
            color: #cbd5e0;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
            background: linear-gradient(45deg, #0072ff, #00c6ff);
        }
        .btn:active {
            transform: translateY(1px);
        }

        /* Power Meter Bar */
        .power-meter-container {
            width: 250px;
            height: 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-top: 4px;
        }
        .power-meter-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4ef037, #fadb14, #ff4d4f);
            transition: width 0.05s linear;
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #a0aec0;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ Ultimate Goal Shooter</h1>
        <p>방향키와 파워 조절로 환상적인 슛을 성공시켜 보세요!</p>
    </div>

    <!-- UI Panel -->
    <div class="game-ui">
        <div class="stat-box">
            <div class="label">점수 (SCORE)</div>
            <div class="value" id="score">0</div>
        </div>
        <div class="stat-box">
            <div class="label">슛 파워 (POWER)</div>
            <div class="power-meter-container">
                <div class="power-meter-fill" id="powerFill"></div>
            </div>
        </div>
        <div class="stat-box">
            <div class="label">남은 기회 (BALLS)</div>
            <div class="value" id="attempts">5</div>
        </div>
    </div>

    <!-- Main Game Canvas -->
    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>

        <!-- Start / Game Over Overlay -->
        <div class="overlay" id="overlay">
            <h2 id="overlayTitle">슈팅 챌린지 시작</h2>
            <p id="overlayDesc">
                <b>[조작 방법]</b><br>
                1. <b>마우스/터치 클릭 유지</b>: 슛 파워 충전<br>
                2. <b>클릭 해제</b>: 슛 발사!<br>
                3. 좌우로 키퍼를 따돌리고 골망을 흔드세요.
            </p>
            <button class="btn" id="startBtn" onclick="startGame()">게임 시작하기</button>
        </div>
    </div>

    <div class="controls-hint">
        마우스 클릭 또는 화면을 누르고 있으면 슛 파워가 모이고, 손을 떼면 공을 차게 됩니다!
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI elements
        const scoreEl = document.getElementById('score');
        const attemptsEl = document.getElementById('attempts');
        const powerFill = document.getElementById('powerFill');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const startBtn = document.getElementById('startBtn');

        // Game state variables
        let score = 0;
        let attempts = 5;
        let gameState = 'START'; // START, AIMING, POWERING, SHOOTING, RESULT, GAMEOVER
        let power = 0;
        let powerDirection = 1;

        // Field & Goal specs
        const goal = {
            x: 200,
            y: 60,
            width: 400,
            height: 160,
            postWidth: 12
        };

        // Goalkeeper specs
        const keeper = {
            x: 400,
            y: 180,
            radius: 22,
            speed: 3.5,
            dir: 1,
            targetX: 400,
            isDiving: false
        };

        // Ball specs
        const ballDefault = {
            x: 400,
            y: 420,
            radius: 16,
            scale: 1.0,
            vx: 0,
            vy: 0,
            vz: 0,
            z: 0
        };
        let ball = { ...ballDefault };

        // Target Aim Marker
        let aimTarget = { x: 400, y: 130 };

        // Dynamic Text Feedback
        let feedbackText = "";
        let feedbackColor = "#fff";
        let feedbackAlpha = 0;

        function initGame() {
            score = 0;
            attempts = 5;
            scoreEl.textContent = score;
            attemptsEl.textContent = attempts;
            resetBall();
        }

        function resetBall() {
            ball = {
                x: 400,
                y: 420,
                radius: 16,
                scale: 1.0,
                vx: 0,
                vy: 0,
                vz: 0,
                z: 0
            };
            keeper.x = 400;
            keeper.y = 180;
            keeper.isDiving = false;
            power = 0;
            powerFill.style.width = '0%';
            if (attempts > 0) {
                gameState = 'AIMING';
            } else {
                endGame();
            }
        }

        function startGame() {
            initGame();
            overlay.classList.add('hidden');
        }

        function endGame() {
            gameState = 'GAMEOVER';
            overlayTitle.textContent = "게임 종료!";
            overlayDesc.innerHTML = `최종 점수: <b>${score}점</b><br>멋진 슈팅이었습니다! 다시 도전해보세요.`;
            startBtn.textContent = "다시 플레이";
            overlay.classList.remove('hidden');
        }

        // Input Handlers
        canvas.addEventListener('mousemove', (e) => {
            if (gameState !== 'AIMING' && gameState !== 'POWERING') return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            aimTarget.x = Math.max(goal.x - 40, Math.min(goal.x + goal.width + 40, mouseX));
            aimTarget.y = Math.max(goal.y - 20, Math.min(goal.y + goal.height + 40, mouseY));
        });

        function startPowering() {
            if (gameState !== 'AIMING') return;
            gameState = 'POWERING';
            power = 0;
            powerDirection = 1;
        }

        function releasePowering() {
            if (gameState !== 'POWERING') return;
            gameState = 'SHOOTING';
            shootBall();
        }

        canvas.addEventListener('mousedown', startPowering);
        window.addEventListener('mouseup', releasePowering);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            aimTarget.x = touch.clientX - rect.left;
            aimTarget.y = touch.clientY - rect.top;
            startPowering();
        });
        window.addEventListener('touchend', releasePowering);

        function shootBall() {
            attempts--;
            attemptsEl.textContent = attempts;

            const dx = aimTarget.x - ball.x;
            const dy = aimTarget.y - ball.y;
            const pFactor = (power / 100) * 0.85 + 0.4;

            ball.vx = (dx / 18) * pFactor;
            ball.vy = (dy / 18) * pFactor;

            const diveDirection = (aimTarget.x - 400) * 0.7;
            keeper.targetX = 400 + diveDirection + (Math.random() * 40 - 20);
        }

        function update() {
            if (gameState === 'POWERING') {
                power += 2.2 * powerDirection;
                if (power >= 100) {
                    power = 100;
                    powerDirection = -1;
                } else if (power <= 0) {
                    power = 0;
                    powerDirection = 1;
                }
                powerFill.style.width = power + '%';
            }

            if (gameState === 'AIMING' || gameState === 'POWERING') {
                keeper.x += keeper.speed * keeper.dir;
                if (keeper.x > goal.x + goal.width - 40) keeper.dir = -1;
                if (keeper.x < goal.x + 40) keeper.dir = 1;
            } else if (gameState === 'SHOOTING') {
                keeper.x += (keeper.targetX - keeper.x) * 0.12;
            }

            if (gameState === 'SHOOTING') {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.scale = Math.max(0.5, 1.0 - ((420 - ball.y) / 500));

                if (ball.y <= goal.y + goal.height / 2 + 10) {
                    checkGoalOutcome();
                }
            }

            if (feedbackAlpha > 0) {
                feedbackAlpha -= 0.02;
            }
        }

        function checkGoalOutcome() {
            gameState = 'RESULT';
            
            const ballRadiusScaled = ball.radius * ball.scale;
            const distToKeeper = Math.hypot(ball.x - keeper.x, ball.y - keeper.y);
            const isSaved = distToKeeper < (keeper.radius + ballRadiusScaled + 10);

            const inGoalX = ball.x > (goal.x + goal.postWidth) && ball.x < (goal.x + goal.width - goal.postWidth);
            const inGoalY = ball.y > goal.y && ball.y < (goal.y + goal.height);

            if (isSaved) {
                triggerFeedback("막혔습니다! (SAVED)", "#ff4d4f");
            } else if (inGoalX && inGoalY) {
                score += 100;
                scoreEl.textContent = score;
                triggerFeedback("골입니다! (GOAL!)", "#52c41a");
            } else {
                triggerFeedback("빗나갔습니다! (MISSED)", "#faad14");
            }

            setTimeout(resetBall, 1600);
        }

        function triggerFeedback(text, color) {
            feedbackText = text;
            feedbackColor = color;
            feedbackAlpha = 1.0;
        }

        function drawPitch() {
            const grass = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grass.addColorStop(0, '#1b5e20');
            grass.addColorStop(1, '#388e3c');
            ctx.fillStyle = grass;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            for (let i = 0; i < canvas.height; i += 40) {
                if ((i / 40) % 2 === 0) {
                    ctx.fillRect(0, i, canvas.width, 20);
                }
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(120, 240);
            ctx.lineTo(680, 240);
            ctx.lineTo(760, 500);
            ctx.lineTo(40, 500);
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(230, 180);
            ctx.lineTo(570, 180);
            ctx.lineTo(620, 240);
            ctx.lineTo(180, 240);
            ctx.closePath();
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(400, 420, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGoal() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;

            const netStep = 15;
            for (let x = goal.x; x <= goal.x + goal.width; x += netStep) {
                ctx.beginPath();
                ctx.moveTo(x, goal.y);
                ctx.lineTo(x, goal.y + goal.height);
                ctx.stroke();
            }
            for (let y = goal.y; y <= goal.y + goal.height; y += netStep) {
                ctx.beginPath();
                ctx.moveTo(goal.x, y);
                ctx.lineTo(goal.x + goal.width, y);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = goal.postWidth;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(goal.x, goal.y + goal.height);
            ctx.lineTo(goal.x, goal.y);
            ctx.lineTo(goal.x + goal.width, goal.y);
            ctx.lineTo(goal.x + goal.width, goal.y + goal.height);
            ctx.stroke();

            ctx.strokeStyle = '#d9d9d9';
            ctx.lineWidth = 2;
            ctx.strokeRect(goal.x - 6, goal.y - 6, goal.width + 12, goal.height + 6);
        }

        function drawKeeper() {
            ctx.save();
            ctx.translate(keeper.x, keeper.y);

            ctx.fillStyle = '#ff5722';
            ctx.beginPath();
            ctx.arc(0, -5, keeper.radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffcc80';
            ctx.beginPath();
            ctx.arc(0, -28, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-keeper.radius - 4, -2, 7, 0, Math.PI * 2);
            ctx.arc(keeper.radius + 4, -2, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBall() {
            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.scale(ball.scale, ball.scale);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(0, ball.radius - 2, ball.radius * 0.9, ball.radius * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#ccc';
            ctx.stroke();

            ctx.fillStyle = '#222222';
            for (let i = 0; i < 5; i++) {
                const angle = (i * 72) * Math.PI / 180;
                const bx = Math.cos(angle) * (ball.radius * 0.55);
                const by = Math.sin(angle) * (ball.radius * 0.55);
                ctx.beginPath();
                ctx.arc(bx, by, ball.radius * 0.22, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawAimLine() {
            if (gameState !== 'AIMING' && gameState !== 'POWERING') return;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(aimTarget.x, aimTarget.y, 14, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ff4d4f';
            ctx.beginPath();
            ctx.arc(aimTarget.x, aimTarget.y, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(aimTarget.x, aimTarget.y);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawFeedback() {
            if (feedbackAlpha <= 0) return;

            ctx.save();
            ctx.globalAlpha = feedbackAlpha;
            ctx.font = '900 36px sans-serif';
            ctx.fillStyle = feedbackColor;
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
            ctx.shadowBlur = 10;
            ctx.fillText(feedbackText, canvas.width / 2, 260);
            ctx.restore();
        }

        function loop() {
            update();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawPitch();
            drawGoal();
            drawKeeper();
            drawAimLine();
            drawBall();
            drawFeedback();

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
